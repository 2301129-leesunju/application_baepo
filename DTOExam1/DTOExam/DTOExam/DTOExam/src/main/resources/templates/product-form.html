<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 등록 폼</title>
    <style>
        .container { width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }

        .input-error {
            border: 2px solid #d93025;
            background: #fff5f5;
        }
        .error-message {
            margin: 5px 0 0;
            color: #d93025;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>상품 등록</h2>
    <form th:action="@{/products}" th:object="${productForm}" method="post" novalidate>

        <div class="form-group">
            <label th:for="title">상품명</label>
            <input type="text" th:field="*{title}" id="title" th:errorclass="input-error" />
            <p class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">상품명 오류 메시지</p>
        </div>

        <div class="form-group">
            <label th:for="price">가격</label>
            <input type="number" th:field="*{price}" id="price" th:errorclass="input-error" />
            <p class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">가격 오류 메시지</p>
        </div>

        <button type="submit">등록하기</button>
    </form>
</div>
</body>
</html>
