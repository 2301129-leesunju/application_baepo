
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>상품 목록</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    .container {
      width: 850px;
      margin: 60px auto;
      padding: 30px;
      background-color: white;
      border: 1px solid #dddddd;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border: 1px solid #dddddd;
      text-align: center;
    }

    th {
      background-color: #f1f3f5;
    }

    .new-link {
      display: inline-block;
      margin-top: 10px;
    }

    .empty-message {
      padding: 25px;
      text-align: center;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 실습 2: 화면 제목 -->
  <h1>상품 목록</h1>

  <!-- 실습 3: 새 상품 등록 링크 -->
  <a class="new-link" th:href="@{/products/new}">새 상품 등록</a>

  <!-- 실습 4: 상품 목록 테이블 -->
  <table>
    <thead>
    <!-- 실습 5: 표 제목 -->
    <tr>
      <th>번호</th>
      <th>상품명</th>
      <th>가격</th>
      <th>수량</th>
      <th>카테고리</th>
      <th>판매 여부</th>
    </tr>
    </thead>

    <tbody>
    <!-- 실습 6~12: 상품 목록 반복 및 출력 -->
    <tr th:each="product : ${products}">

      <!-- 실습 7: 상품 번호 -->
      <td th:text="${product.id}"></td>

      <!-- 실습 8: 상품명 및 상세 화면 링크 -->
      <td>
        <a th:href="@{/products/{id}(id=${product.id})}"
           th:text="${product.title}"></a>
      </td>

      <!-- 실습 9: 상품 가격 -->
      <td th:text="|${product.price}원|"></td>

      <!-- 실습 10: 상품 수량 -->
      <td th:text="${product.quantity}"></td>

      <!-- 실습 11: 상품 카테고리 -->
      <td th:text="${product.category}"></td>

      <!-- 실습 12: 판매 여부 -->
      <td th:text="${product.onSale ? '판매 중' : '판매 안 함'}"></td>

    </tr>

    <!-- 실습 13: 상품이 없는 경우 -->
    <tr th:if="${#lists.isEmpty(products)}">
      <td class="empty-message" colspan="6">
        등록된 상품이 없습니다.
      </td>
    </tr>
    </tbody>
  </table>

  <!-- 실습 14: 메인 화면 링크 -->
  <a class="home-link" th:href="@{/}">메인 화면으로</a>
</div>

</body>
</html>
