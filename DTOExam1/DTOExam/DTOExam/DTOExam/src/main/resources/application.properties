# spring Boot 애플리케이션 이름
spring.application.name=DTOExam

#h2를 파일 방식으로
spring.datasource.url=jdbc:h2:file:./data/studydb

# h2에 접속 계정 설정
spring.datasource.username=sa

# h2 접속 비밀번호
spring.datasource.password=

#Entity를 기준으로 테이블을 만들거나 변경하면서 기존 데이터 유지
spring.jpa.hibernate.ddl-auto=update

#Hibernate가 생성하여 실행한 sql을 인텔리 제이 보여줌
spring.jpa.show-sql=true
server.port = 9090
spring.jap.properties.hibernate.format_sql=true
#브라우저에서 h2 콘솔을 보기위한 설정
spring.h2.console.enable=true
spring.h2.console.path=/h2-console
#https://localhost:9090/h2-console
