<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>스터디 신청 수정</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;}
        .container {
            width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);}
        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;}
        .form-group {
            margin-bottom: 20px;}
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;}
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;}
        .error {
            margin-top: 5px;
            color: red;
            font-size: 14px;}
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;}
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;}
        .button-link {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            box-sizing: border-box;}
        .submit-button {
            background-color: #333;
            color: white;}
        .cancel-button {
            background-color: #ddd;
            color: #333;}
    </style>
</head>
<body>
    <div class="container">
        <h1> 스터디 신청 수정 폼 </h1>
        <form th:action="@{/study/{id}/edit(id=${studyId})}" th:object="${studyForm}" method="post" novalidate>
            <label for="name">작성자 이름</label>
            <input type="text" id="name" th:field="*{name}" th:errorclass="input-error" required/>
            <p class="error-message" th:errors="*{name}">신청자 이름 오류</p>
            <label for="topic">관심 주제</label>
            <select id="topic" th:field="*{topic}" th:errorclass="input-error" required>
                <option value="">주제를 선택하세요.</option>
                <option value="Spring Boot">Spring Boot</option>
                <option value="Java">Java</option>
                <option value="Database">데이터베이스</option>
            </select>
            <p class="error-message" th:errors="*{topic}">관심주제 오류</p>
            <label for="studyHours">주당 스터디 시간</label>
            <input type="number" id="studyHours" th:field="*{studyHours}" th:errorclass="input-error" min="1" required/>
            <p class="error-message" th:errors="*{studyHours}">학습 시간 오류</p>
            <button type="submit">신청하기</button>
        </form>

    </div>
</body>
</html>
