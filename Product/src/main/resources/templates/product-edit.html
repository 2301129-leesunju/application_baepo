
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>상품 수정</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .error {
            margin-top: 5px;
            color: red;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .button-link {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .submit-button {
            background-color: #333;
            color: white;
        }

        .cancel-button {
            background-color: #ddd;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>상품 수정</h1>

    <form th:action="@{/product/{id}/edit(id=${productId})}"
          th:object="${productForm}"
          method="post">

        <div class="form-group">
            <label for="title">상품명</label>
            <input type="text"
                   id="title"
                   th:field="*{title}"/>

            <p class="error"
               th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}"></p>
        </div>

        <div class="form-group">
            <label for="price">가격</label>
            <input type="number"
                   id="price"
                   min="0"
                   th:field="*{price}"/>

            <p class="error"
               th:if="${#fields.hasErrors('price')}"
               th:errors="*{price}"></p>
        </div>

        <div class="form-group">
            <label for="quantity">수량</label>
            <input type="number"
                   id="quantity"
                   min="1"
                   th:field="*{quantity}"/>

            <p class="error"
               th:if="${#fields.hasErrors('quantity')}"
               th:errors="*{quantity}"></p>
        </div>

        <div class="form-group">
            <label for="category">카테고리</label>
            <select id="category" th:field="*{category}">

                <option value="">카테고리를 선택하세요</option>
                <option value="전자제품">전자제품</option>
                <option value="도서">도서</option>
                <option value="생활용품">생활용품</option>

            </select>

            <p class="error"
               th:if="${#fields.hasErrors('category')}"
               th:errors="*{category}"></p>
        </div>

        <div class="form-group">
            <label for="onSale">판매 상태</label>
            <select id="onSale" th:field="*{onSale}">

                <option value="true">판매 중</option>
                <option value="false">판매 중지</option>

            </select>

            <p class="error"
               th:if="${#fields.hasErrors('onSale')}"
               th:errors="*{onSale}"></p>
        </div>

        <div class="button-group">

            <button type="submit" class="submit-button">
                수정 완료
            </button>

            <a th:href="@{/product/{id}(id=${productId})}"
               class="button-link cancel-button">
                취소
            </a>

        </div>

    </form>

</div>

</body>
</html>
