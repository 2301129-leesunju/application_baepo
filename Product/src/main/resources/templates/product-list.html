
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 850px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #dddddd;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #dddddd;
            text-align: center;
        }

        th {
            background-color: #f1f3f5;
        }

        .new-link {
            display: inline-block;
            margin-top: 10px;
        }

        .empty-message {
            padding: 25px;
            text-align: center;
        }

        .home-link {
            display: block;
            margin-top: 20px;
            text-align: center;
        }

        .favorite-btn {
            border: none;
            background: none;
            font-size: 24px;
            color: #aaaaaa;
            cursor: pointer;
        }

        .favorite-btn.active {
            color: #ffc107;
        }

        .favorite-row {
            background-color: #fff8dc;
            font-weight: bold;
        }

        .favorite-row td {
            border-color: #f0d878;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>상품 목록</h1>

    <a th:href="@{/product/new}" class="new-link">새 상품 등록</a>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>상품명</th>
            <th>가격</th>
            <th>수량</th>
            <th>카테고리</th>
            <th>판매 여부</th>
            <th>즐겨찾기</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}" th:attr="data-id=${product.id}">
            <td>
                <a th:href="@{/product/{id}(id=${product.id})}"
                   th:text="${product.id}"></a>
            </td>

            <td>
                <a th:href="@{/product/{id}(id=${product.id})}"
                   th:text="${product.title}"></a>
            </td>

            <td th:text="|${product.price}원|"></td>

            <td th:text="${product.quantity}"></td>

            <td th:text="${product.category}"></td>

            <td th:text="${product.onSale ? '판매 중' : '판매 안 함'}"></td>

            <td>
                <button type="button" class="favorite-btn"
                        th:attr="data-id=${product.id}"
                        aria-label="즐겨찾기">
                    ☆
                </button>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="7" class="empty-message">
                등록된 상품이 없습니다.
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="home-link">메인 화면으로</a>

</div>

<script>
    const STORAGE_KEY = "favoriteProducts";

    function getFavorites() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    }

    function updateFavoriteDisplay() {
        const favorites = getFavorites();

        document.querySelectorAll("tbody tr[data-id]").forEach(row => {
            const id = row.dataset.id;
            const button = row.querySelector(".favorite-btn");
            const isFavorite = favorites.includes(id);

            button.textContent = isFavorite ? "★" : "☆";
            button.classList.toggle("active", isFavorite);
            row.classList.toggle("favorite-row", isFavorite);
        });
    }

    document.querySelectorAll(".favorite-btn").forEach(button => {
        button.addEventListener("click", function () {
            const id = this.dataset.id;
            let favorites = getFavorites();

            if (favorites.includes(id)) {
                favorites = favorites.filter(item => item !== id);
            } else {
                favorites.push(id);
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
            updateFavoriteDisplay();
        });
    });

    updateFavoriteDisplay();
</script>

</body>
</html>
