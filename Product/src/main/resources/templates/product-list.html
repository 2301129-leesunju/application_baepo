<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 850px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #dddddd;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #dddddd;
            text-align: center;
        }

        th {
            background-color: #f1f3f5;
        }

        .new-link {
            display: inline-block;
            margin-top: 10px;
        }

        .empty-message {
            padding: 25px;
            text-align: center;
        }

        .home-link {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>상품 목록</h1>

    <a th:href="@{/products/new}" class="new-link">새 상품 등록</a>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>상품명</th>
            <th>가격</th>
            <th>수량</th>
            <th>카테고리</th>
            <th>판매 여부</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>

            <td>
                <a th:href="@{/products/{id}(id=${product.id})}"
                   th:text="${product.title}"></a>
            </td>

            <td th:text="|${product.price}원|"></td>

            <td th:text="${product.quantity}"></td>

            <td th:text="${product.category}"></td>

            <td th:text="${product.onSale ? '판매 중' : '판매 안 함'}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="6" class="empty-message">
                등록된 상품이 없습니다.
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="home-link">메인 화면으로</a>

</div>

</body>
</html>
