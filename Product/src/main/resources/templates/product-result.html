
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>상품 등록 결과</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 460px;
            margin: 80px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #dddddd;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .result p {
            margin: 12px 0;
        }

        .link-area {
            text-align: center;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>상품 등록 완료</h1>

    <div class="result">

        <p>상품명 :
            <strong th:text="${productForm.title}">상품 이름</strong>
        </p>

        <p>가격 :
            <strong th:text="${productForm.price}">0</strong> 원
        </p>

        <p>수량 :
            <strong th:text="${productForm.quantity}">0</strong> 개
        </p>

        <p>카테고리 :
            <strong th:text="${productForm.category}"></strong>
        </p>

        <p>판매 여부 :
            <strong th:text="${productForm.onSale}"></strong>
        </p>

    </div>

    <div class="link-area">

        <a th:href="@{/product/new}">다시 등록하기</a>
        <br>
        <a th:href="@{/}">메인 화면으로</a>

    </div>

</div>

</body>

</html>
