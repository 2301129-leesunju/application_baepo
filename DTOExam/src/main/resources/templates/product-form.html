<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 등록</title>
    <style>
        /* body
           웹 페이지 전체 영역에 적용됩니다.
           font-family는 글꼴을 지정하고,
           background-color는 페이지 전체 배경색을 지정합니다.
        */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }
        /* .container
           class="container"가 작성된 요소에 적용됩니다.
           class는 여러 HTML 요소에 같은 디자인을 적용할 때 사용할 수 있습니다.
        */
        .container {
            width: 460px;                 /* 영역의 너비 */
            margin: 60px auto;            /* 위아래 여백 60px, 좌우 가운데 정렬 */
            padding: 30px;                /* 내부 여백 */
            background-color: white;      /* 배경색 */
            border: 1px solid #dddddd;    /* 테두리 */
            border-radius: 12px;          /* 모서리를 둥글게 */
        }

        /* h1 태그의 글자를 가운데 정렬합니다. */
        h1 {
            text-align: center;
        }

        /* label
           입력 항목의 제목 부분에 적용됩니다.
        */
        label {
            display: block;               /* 한 줄 전체를 차지하도록 설정 */
            margin-top: 16px;             /* 위쪽 여백 */
            margin-bottom: 6px;           /* 아래쪽 여백 */
        }

        /* input과 select 입력 요소에 공통으로 적용됩니다. */
        input,
        select {
            width: 100%;                  /* 부모 영역의 너비만큼 사용 */
            padding: 10px;                /* 입력창 내부 여백 */
            box-sizing: border-box;       /* padding까지 포함해서 너비 계산 */
        }

        /* 상품 등록 버튼에 적용됩니다. */
        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            cursor: pointer;              /* 마우스를 올리면 손 모양으로 표시 */
        }

        /* class="home-link"가 작성된 링크에 적용됩니다. */
        .home-link {
            display: block;
            margin-top: 18px;
            text-align: center;
        }
        .input-error{
            border: 2px solid #d93025;
            background: #fff5f5;
        }
        .error-message{
            margin: 5px 0 0;
            color: #d93025;
            font-size: 14px;
        }


    </style>
</head>

<body>
<div class="container">
    <h1>상품 등록</h1>
    <form th:action="@{/products}" th:object="${productForm}" method="post" novalidate>
        <label for="title">상품 이름</label>
        <input type="text" id="title" th:field="*{title}" th:errorclass="input-error" required/>
        <p class="error-message" th:errors="*{title}">상품 이름 오류</p>
        <label for="price">
            가격
        </label>
        <input type="number" id="price" min="0" th:field="*{price}" th:errorclass="input-error" required/>
        <p class="error-message" th:errors="*{price}">가격 입력 오류</p>

        <label for="quantity">
            수량
        </label>
        <input type="number" id="quantity" min="0" th:field="*{quantity}" th:errorclass="input-error" required/>
        <p class="error-message" th:errors="*{quantity}">수량 입력 오류</p>

        <label for="category" >카테고리 선택</label>
        <select id="category" th:field="*{category}" th:errorclass="input-error" required>
            <option value="">카테고리를 선택하세요</option>
            <option value="전자제품">전자제품</option>
            <option value="도서">도서</option>
            <option value="생활용품">생활용품</option>
        </select>
        <p class="error-message" th:errors="*{category}">카테고리 선택 오류</p>
        <label for="onSale" >판매 상태 선택</label>
        <select id="onSale" th:field="*{onSale}" th:errorclass="input-error" required>
            <option value="true">판매 중</option>
            <option value="false">판매 안 함</option>
        </select>
        <p class="error-message" th:errors="*{onSale}">판매 선택 오류</p>

        <button type="submit">상품 등록</button>

    </form>
    <a th:href="@{/}" class="home-link">메인화면으로</a>
</div>
<!--      아래 조건에 맞게 상품 등록 화면을 완성하세요.
    1. 전체 내용을 감싸는 div를 작성합니다.
       - class="container" 사용

    2. 제목을 작성합니다.
       - 상품 등록

    3. form 태그를 작성합니다.
       - /products 주소로 전송
       - POST 방식 사용

    4. 상품명 입력창을 작성합니다.
       - label의 for : title
       - input의 id : title
       - input의 name : title
       - 필수 입력

    5. 가격 입력창을 작성합니다.
       - 숫자 입력
       - id : price
       - name : price
       - 최소값 : 0
       - 필수 입력

    6. 수량 입력창을 작성합니다.
       - 숫자 입력
       - id : quantity
       - name : quantity
       - 최소값 : 1
       - 필수 입력

    7. 카테고리 선택 상자를 작성합니다.
       - id : category
       - name : category
       - 필수 선택
       - 선택 항목:
         카테고리를 선택하세요
         전자제품
         도서
         생활용품

    8. 판매 여부 선택 상자를 작성합니다.
       - id : onSale
       - name : onSale
       - 필수 선택
       - 판매 중 : true
       - 판매 안 함 : false

    9. 상품 등록 버튼을 작성합니다.
       - type="submit"

    10. 메인 화면으로 이동하는 링크를 작성합니다.
        - /
        - class="home-link"

    [참고]

    id
    → HTML 요소를 구별하기 위한 고유한 이름입니다.
    → label의 for와 연결할 때 사용합니다.

    name
    → 입력값을 서버로 전송할 때 사용하는 이름입니다.
    → ProductForm의 프로퍼티 이름과 같아야 합니다.

    class
    → CSS 디자인을 적용하기 위한 이름입니다.

    required
    → 값을 입력하거나 선택하지 않으면 브라우저가 제출을 막습니다.

    th:action
    → form 데이터를 전송할 서버 주소를 지정합니다.

    th:href
    → 링크를 클릭했을 때 이동할 주소를 지정합니다.
-->


<!-- 학생 작성 끝 -->

</body>

</html>
